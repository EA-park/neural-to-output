site_name: neural-to-output
site_description: An open-source framework for translating human electrophysiological signals into robot actions.
repo_url: https://github.com/EA-park/neural-to-output
repo_name: EA-park/neural-to-output

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - content.code.copy

plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
  - Architecture: architecture.md
  - Signal: signal/index.md
  - Decoder: decoder/index.md
  - Robot:
      - Arm: robot/arm/index.md
      - Hand: robot/hand/index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Adding a Component: tutorials/adding-a-component.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
