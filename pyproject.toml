[project]
name = "neural-to-output"
version = "0.1.0"
description = "An open-source framework for translating human electrophysiological signals into robot actions."
requires-python = ">=3.12"
dependencies = [
    "braindecode>=1.7.0",
    "huggingface-hub>=0.30.0",
    "moabb>=1.5.0",
    # Pinned to the 3.12 line specifically (not just >=3.12.0) to match the
    # native libmujoco.so version used by the MuJoCo Unity plugin engine in the
    # companion neural-to-output-unity repo (not yet published -- see
    # apps/console.py's engine setup tips). A newer mujoco here without also
    # updating that native library would desync the two.
    "mujoco>=3.12.0,<3.13.0",
]

[project.scripts]
neural-to-output = "n2o:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "n2o"
# Unity-only content (no Python code anywhere in this repo ever reads it, unlike the
# MuJoCo mjcf/ folders these sit next to -- those genuinely get loaded by
# n2o.robot.simulation.mujoco at runtime) -- shipping it to `pip install n2o` users
# would be pure dead weight, most of whom have no interest in the Unity backend at
# all.
source-exclude = [
    "src/n2o/robot/arm/so101/unity_model/**",
    "src/n2o/robot/hand/amazing_hand_right/unity_model/**",
]
wheel-exclude = [
    "src/n2o/robot/arm/so101/unity_model/**",
    "src/n2o/robot/hand/amazing_hand_right/unity_model/**",
]

[tool.ruff]
# `third_party/` is vendored upstream code (see CLAUDE.md's `third_party/` section) --
# it must stay byte-for-byte as its upstream source, so it's never linted/formatted.
# The unity_model/ paths are non-Python Unity content -- ruff only touches .py
# files anyway, this just keeps it from walking large asset trees for nothing.
extend-exclude = [
    "third_party",
    "src/n2o/robot/arm/so101/unity_model",
    "src/n2o/robot/hand/amazing_hand_right/unity_model",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
license = [
    "pip-licenses>=5.5.5",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-static-i18n>=1.3.1",
    "mkdocstrings[python]>=0.30.1",
]
examples = [
    "jupyter>=1.1.1",
    "lerobot[feetech]",
    "rustypot>=1.5.0",
    "torchaudio>=2.0",
    "py-trees>=2.5.0",
]
# `demos/` holds standalone applications (not the numbered tutorial notebooks in `examples/`) --
# kept as its own group so app-specific packages (e.g. a web framework) don't leak into the
# tutorial dependency set. Reuses `examples`' ML/robot stack via `include-group` instead of
# re-declaring it.
demos = [
    { include-group = "examples" },
    "flask>=3.0",
]
# The desktop console (apps/console.py) wires up real n2o components
# (dataset/decoder/robot), so it needs `demos`' own ML/robot stack -- PySide6 is the
# only thing this group adds on top of that.
app = [
    { include-group = "demos" },
    "PySide6>=6.7",
]

# `lerobot_robot_so101_5dof` (the 5-motor SO-101 follower plugin used by
# examples/07_real_so101_arm_control.ipynb) targets this commit's API, which is ahead of
# the "0.6.1" published on PyPI (e.g. `lerobot.types` doesn't exist there yet) -- pin to it here
# so `uv sync --group examples` resolves a compatible lerobot. Pinned directly to the real
# huggingface/lerobot repo (not a fork -- there was never a reason for one: this commit has
# no local patches, it's plain upstream history, huggingface/lerobot PR #4203).
[tool.uv]
# lerobot pins draccus==0.10.0 exactly, which requires pyyaml-include (GPLv3+, no
# alternative license) for its YAML `!include` tag support. draccus 0.11.6 dropped
# that dependency by reimplementing `!include` itself in pure PyYAML (same
# FullLoaderWithInclusion/SafeLoaderWithInclusion classes, same tag name -- a
# behavior-compatible drop-in, not a feature removal, confirmed by diffing
# draccus/parsers/yaml_loader.py between the two versions). Overriding the pin here
# instead of patching lerobot's own pyproject.toml keeps this a one-line, easily
# revisited fix.
override-dependencies = ["draccus==0.11.6"]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "f37be3edbee60f3a09a5183788b91eb19f0c07d1" }
# lerobot's own pyproject pins torch/torchvision to this same index on Linux but not
# torchaudio (it doesn't need it) -- braindecode (now a core dependency, see
# `signal/dataset/moabb_entry.py`) pulls in torchaudio transitively, and without this pin it
# resolved a plain-PyPI torchaudio wheel expecting a different CUDA runtime than the cu128
# torch build, breaking `import braindecode` with a "libcudart.so.13: cannot open shared
# object file" error.
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
