name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  install-verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - run: uv run python -c "import n2o"
      - run: uv run pytest

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --group license
      - name: Fail on copyleft-licensed dependencies
        # --ignore-packages also lists pycountry (a moabb dependency): it's
        # LGPL-2.1-only, not on the --fail-on list itself, but --partial-match's
        # substring matching makes "GPL" match "LGPL-2.1-only" as a false positive.
        run: >
          uv run pip-licenses --ignore-packages neural-to-output pycountry
          --fail-on="GPL;SSPL;Commons Clause;BUSL"
          --partial-match
